name: 'Publish Tauri Release'

on:
  push:
    tags:
      - 'v*'
      - 'app-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install frontend dependencies
        working-directory: ./frontend-desktop
        run: npm install

      - name: setup signing keys
        shell: bash
        run: |
          KEY="${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}"
          if [ -z "$KEY" ]; then
            KEY="${{ secrets.TAURI_PRIVATE_KEY }}"
          fi
          echo "TAURI_SIGNING_PRIVATE_KEY<<EOF" >> $GITHUB_ENV
          echo "$KEY" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          echo "TAURI_PRIVATE_KEY<<EOF" >> $GITHUB_ENV
          echo "$KEY" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

          PWD="${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}"
          if [ -z "$PWD" ]; then
            PWD="${{ secrets.TAURI_KEY_PASSWORD }}"
          fi
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$PWD" >> $GITHUB_ENV
          echo "TAURI_KEY_PASSWORD=$PWD" >> $GITHUB_ENV

      - name: build tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: './frontend-desktop'
          tagName: app-v__VERSION__
          releaseName: 'CuiCall v__VERSION__'
          releaseBody: 'Uma nova versão do CuiCall está disponível!'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
